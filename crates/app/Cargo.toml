# Normal (non-dev) dependency: the beacon/validator mocks are wired into the
# production `pluto run` path for simnet mode (`--simnet-beacon-mock` /
# `--simnet-validator-mock`), mirroring Charon which always compiles its mocks
# into the binary.
pluto-testutil.workspace = true

[build-dependencies]
pluto-build-proto.workspace = true

[dev-dependencies]
libp2p.workspace = true
wiremock.workspace = true
test-case.workspace = true
tower = { workspace = true, features = ["util"] }
rand.workspace = true
# `test-cluster` (gated behind the feature) provides `new_for_test`, used by the
# simnet boot test. A dev-dep feature so it never reaches the release binary.
pluto-cluster = { workspace = true, features = ["test-cluster"] }

