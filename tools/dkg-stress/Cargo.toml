[package]
name = "dkg-stress"
version = "0.1.0"
edition = "2024"
publish = false
description = "Stress runner for DKG ceremonies (wraps scripts/dkg-runner/run.sh, ratatui UI)"

[[bin]]
name = "dkg-stress"
path = "src/main.rs"

[dependencies]
anyhow = "1"
ansi-to-tui = "7"
clap = { version = "4.5", features = ["derive", "env"] }
ratatui = "0.29"
libc = "0.2"
signal-hook = "0.3"

[profile.release]
opt-level = 3
lto = "thin"
